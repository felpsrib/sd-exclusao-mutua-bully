[pytest]
testpaths = testes.py
# Cada teste tem no máximo 60 s: um deadlock vira falha, não um terminal travado.
timeout = 60
markers =
    nivel1: protocolo e infraestrutura (já passa com o esqueleto)
    nivel2: exclusão mútua centralizada (Partes A e B)
    nivel3: eleição pelo Valentão e heartbeat (Partes C e D)
    nivel4: falha do coordenador e continuidade (Cenário 2)
    nivel5: desafios
    desafio: testes bônus (não obrigatórios)
